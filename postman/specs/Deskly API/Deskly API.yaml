openapi: 3.0.0
info:
  title: Deskly API
  version: 1.0.0
  description: ''
servers:
  - url: 'http://localhost:4000'
paths:
  /health:
    get:
      summary: Health Check
      responses: {}
  /desks:
    get:
      summary: Get all desks
      parameters:
        - name: zone
          in: query
          description: 'Optional. Filter by zone (north, south, quiet).'
          schema:
            type: string
          example: north
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses: {}
  '/desks/{deskId}':
    get:
      summary: Get desk by ID
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses: {}
    parameters:
      - name: deskId
        in: path
        required: true
        schema:
          type: string
        example: desk-1
  /bookings:
    get:
      summary: Get all bookings
      parameters:
        - name: date
          in: query
          description: Optional. Filter by date (YYYY-MM-DD).
          schema:
            type: string
          example: '2025-08-01'
        - name: deskId
          in: query
          description: Optional. Filter by desk ID.
          schema:
            type: string
          example: desk-1
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses: {}
    post:
      summary: Create booking
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deskId:
                  type: string
                date:
                  type: string
                  format: date
                bookedBy:
                  type: string
                  format: email
            example:
              deskId: desk-2
              date: '2025-08-15'
              bookedBy: alex@example.com
  '/bookings/{bookingId}':
    get:
      summary: Get booking by ID
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses: {}
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
        example: bkg_seed01
    delete:
      summary: Delete booking
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses: {}
